name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: run the suite
        run: make check PYTHON=python

  packaging:
    name: install and shell files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: make install into a staging root
        run: |
          make install DESTDIR="$PWD/staging" PREFIX=/usr
          test -x staging/usr/bin/hotspotd
          test -f staging/usr/lib/systemd/system/hotspotd.service
          test -f staging/usr/share/man/man8/hotspotd.8

      - name: install for real, then check the command and the unit
        run: |
          sudo make install PREFIX=/usr
          hotspotd --version
          hotspotd status
          # The unit names an absolute ExecStart, so it can only be verified
          # against a real installation. --man=no because the runner has no
          # man database for a page installed seconds ago.
          systemd-analyze verify --man=no /usr/lib/systemd/system/hotspotd.service

      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -m hotspotd --version

      - name: shellcheck the completion
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=bash contrib/hotspotd.bash

      - name: man page has no formatting errors
        run: |
          sudo apt-get install -y -qq groff
          ! groff -man -Tutf8 -ww man/hotspotd.8 2>&1 >/dev/null | grep .
